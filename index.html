function debriefHtml(r){
  var turns = r.transcript ? r.transcript.filter(function(m){return m.role==="me";}).length : 0;
  var trail = r.trail || [];
  var maxAbs = 1; trail.forEach(function(t){ if(Math.abs(t.delta)>maxAbs) maxAbs = Math.abs(t.delta); });
  var bars = trail.map(function(t,i){
    var h = Math.max(4, Math.round(Math.abs(t.delta)/maxAbs*42));
    return '<div class="db-bar ' + (t.delta>0?"up":t.delta<0?"down":"") + '" style="height:'+h+'px" title="Turn '+(i+1)+': '+(t.delta>0?"+":"")+t.delta+' suspicion"></div>';
  }).join("");
  var peak = trail.reduce(function(m,t){ return Math.max(m,t.susp); }, 0);
  return '<div class="debrief" id="debrief">' +
    '<h3>Debrief</h3>' +
    '<p class="db-sub">' + turns + ' turn' + (turns===1?"":"s") + ' · peak suspicion ' + peak + ' · hidden by default so you can retry blind.</p>' +
    (trail.length ? '<div class="db-trail" aria-label="Suspicion change per turn">' + bars + '</div>' : '') +
    '<div class="db-row">' +
      '<button class="db-btn" id="db-tx-btn" onclick="toggleTranscript()">Show transcript</button>' +
      '<button class="db-btn" id="db-ai-btn" onclick="requestDebrief()">Get coach notes</button>' +
    '</div>' +
    '<div id="db-tx" style="display:none"></div>' +
    '<div id="db-ai"></div>' +
  '</div>';
}
function toggleTranscript(){
  var box = document.getElementById("db-tx"), btn = document.getElementById("db-tx-btn");
  if(!box || !lastResult) return;
  var open = box.style.display !== "none";
  if(open){ box.style.display = "none"; btn.textContent = "Show transcript"; return; }
  var tx = lastResult.transcript || [];
  box.innerHTML = tx.length ? '<div class="db-transcript">' + tx.map(function(m){
    return '<div class="msg ' + (m.role==="me"?"me":"npc") + '"><span class="tag">' + (m.role==="me"?"you":"target") + '</span>' + esc(m.text) + '</div>';
  }).join("") + '</div>' : '<p class="db-sub">No messages were exchanged.</p>';
  box.style.display = "block"; btn.textContent = "Hide transcript";
}
async function requestDebrief(){
  var r = lastResult, btn = document.getElementById("db-ai-btn"), out = document.getElementById("db-ai");
  if(!r || !btn || !out) return;
  if(r.debrief){ out.innerHTML = '<div class="db-text">' + coachHtml(r.debrief) + '</div>'; return; }
  var tx = (r.transcript||[]);
  if(!tx.length){ out.innerHTML = '<p class="db-sub">Nothing to review yet. Say something next run.</p>'; return; }
  btn.disabled = true; btn.textContent = "Reviewing…";
  var convo = tx.map(function(m){ return (m.role==="me" ? "PLAYER: " : "TARGET: ") + m.text; }).join("\n");
  var sys = "You are a coach reviewing a fictional, consensual social-engineering training game (" + r.mode.name + ", case \"" + r.caseObj.name + "\", difficulty " + r.diff.name + "). The player " + (r.won ? "succeeded" : "failed") + ": " + r.reason + " Final suspicion " + r.suspicion + "/100. Give a short debrief in plain text with exactly three labeled lines: 'Worked:', 'Raised suspicion:', 'Try next:'. Each line is one or two sentences about specific moments in the transcript, framed as defensive/awareness lessons (what a real employee should notice). Under 110 words total. No markdown.";
  var text = await fetchTextFromModel(sys, convo);
  btn.disabled = false; btn.textContent = "Get coach notes";
  if(!text){ out.innerHTML = '<p class="gate-err">Couldn\'t reach Claude for the debrief. Try again.</p>'; return; }
  r.debrief = text;
  out.innerHTML = '<div class="db-text">' + coachHtml(text) + '</div>';
}
function coachHtml(t){
  return esc(t).replace(/^(Worked:|Raised suspicion:|Try next:)/gm, "<b>$1</b>");
}

function endActionsHtml(){
  return '<div class="end-actions">' +
    '<button class="again-btn" onclick="retryMission()">Retry this case</button>' +
    '<button class="again-btn ghost" onclick="changeDifficulty()">Change difficulty</button>' +
    '<button class="again-btn ghost" onclick="startPlaying()">New mission</button>' +
    '<button class="again-btn ghost" onclick="lbForLast()">Leaderboard</button>' +
  '</div>';
}

function renderEnd(){
  var r = lastResult;
  var usedSeconds = Math.max(0, r.diff.seconds - r.timeLeft);
  var score = computeScore(r.won, r.timeLeft, r.suspicion, r.diff.id);

  var submitHtml = "";
  if(r.won){
    submitHtml =
      '<div class="submit-row">' +
        '<button id="lb-submit-btn" onclick="submitScore(' + score + ')">Submit as ' + esc(profileName||"operator") + '</button>' +
      '</div>';
  }

  root.innerHTML = siteChrome("missions",
    '<div class="end-wrap ' + screenAnimClass("end") + '">' +
      '<div class="end-status ' + (r.won?"win":"lose") + '">' + (r.won?(r.assisted?"Flag captured · ASSISTED":"Flag captured"):"Mission failed") + '</div>' +
      (r.won&&r.assisted?'<div class="assist-note">Solved with '+r.hintsUsed+' hint'+(r.hintsUsed===1?"":"s")+'. Flagged assisted, not a full clear.</div>':"") +
      '<p style="color:var(--ink-dim);font-size:14px;">' + esc(r.reason) + '</p>' +
      (r.won ? '<div class="end-flag mono">' + esc(r.flag) + '</div>' : '') +
      '<div class="score-label">Score</div>' +
      '<div class="score-big mono" id="score-big-val">0</div>' +
      '<div class="end-stats">' +
        '<div><span class="mono">' + fmtTime(usedSeconds) + '</span><small>time used</small></div>' +
        '<div><span class="mono">' + r.suspicion + '</span><small>final suspicion</small></div>' +
        '<div><span class="mono">' + esc(r.diff.name) + '</span><small>difficulty</small></div>' +
      '</div>' +
      '<div id="submit-area">' + submitHtml + '</div>' +
      endActionsHtml() +
      debriefHtml(r) +
    '</div>');
  animateCountUp(document.getElementById("score-big-val"), score, 700);
}

async function submitScore(score){
  if(!profileName) return;
  var btn = document.getElementById("lb-submit-btn");
  if(btn){ btn.disabled = true; btn.textContent = "Submitting…"; }
  var ok = await pushToBoard(lastResult.mode.id, lastResult.caseObj.id, lastResult.diff.id, {name:profileName, score:score, assisted:!!lastResult.assisted});
  var area = document.getElementById("submit-area");
  if(!area) return;
  if(ok){
    area.innerHTML = '<div class="submitted-note">&#10003; logged to ' + esc(lastResult.caseObj.id) + ' / ' + esc(lastResult.diff.name) + ' board</div>';
  } else {
    area.innerHTML = '<div class="gate-err" style="margin-bottom:22px;">Couldn\'t reach the leaderboard. Your score stands, but it wasn\'t saved.</div>';
  }
}

/* ==================== LEADERBOARD ==================== */

function showLeaderboard(){ ui.screen = "leaderboard"; renderLeaderboard(); }
function lbForLast(){ if(lastResult){ lb.modeId = lastResult.mode.id; lb.caseId = lastResult.caseObj.id; lb.diffId = lastResult.diff.id; } showLeaderboard(); }
function lbSelectMode(id){ lb.modeId = id; lb.caseId = CASES_BY_MODE[id][0].id; renderLeaderboard(); }
function lbSelectCase(id){ lb.caseId = id; renderLeaderboard(); }
function lbSelectDiff(id){ lb.diffId = id; renderLeaderboard(); }

function renderLeaderboard(){
  var modeChips = MODES.map(function(m){
    return '<div class="lb-chip ' + (lb.modeId===m.id?"active":"") + '" onclick="lbSelectMode(\'' + m.id + '\')">' + esc(m.name) + '</div>';
  }).join("");
  var casesForMode = CASES_BY_MODE[lb.modeId];
  var caseChips = casesForMode.map(function(c){
    return '<div class="lb-chip ' + (lb.caseId===c.id?"active":"") + '" onclick="lbSelectCase(\'' + c.id + '\')">' + esc(c.name) + '</div>';
  }).join("");
  var diffChips = DIFFICULTIES.map(function(d){
    return '<div class="lb-chip ' + (lb.diffId===d.id?"active":"") + '" onclick="lbSelectDiff(\'' + d.id + '\')">' + esc(d.name) + '</div>';
  }).join("");

  root.innerHTML = siteChrome("leaderboard",
    '<div class="lb-wrap ' + screenAnimClass("leaderboard") + '">' +
      '<div class="brand"><div class="brand-mark"></div><h1>Leaderboards</h1></div>' +
      '<p class="tagline" style="margin-bottom:24px;">Top scores per mode, case file, and difficulty.</p>' +
      '<p class="section-label">Mode</p><div class="lb-select-row">' + modeChips + '</div>' +
      '<p class="section-label">Case file</p><div class="lb-select-row">' + caseChips + '</div>' +
      '<p class="section-label">Difficulty</p><div class="lb-select-row">' + diffChips + '</div>' +
      '<div class="lb-table" id="lb-table"><div class="lb-empty">loading…</div></div>' +
    '</div>');
  loadBoard();
}

async function loadBoard(){
  var board = await getBoard(lb.modeId, lb.caseId, lb.diffId);
  var table = document.getElementById("lb-table");
  if(!table) return;
  if(board.length===0){
    table.innerHTML = '<div class="lb-empty">No clears logged yet for this combo. Be first.</div>';
    return;
  }
  table.innerHTML = board.map(function(e,i){
    var mine = profileName && e.name && e.name.toLowerCase()===profileName.toLowerCase();
    return '<div class="lb-row' + (mine?" you-row":"") + '"><div class="lb-rank">#' + (i+1) + '</div><div class="lb-name">' + esc(e.name) + (mine?" <span class=\"case-cleared\">you</span>":"") + (e.assisted?" <span class=\"lb-assist\" title=\"assisted clear\">&#9873;</span>":"") + '</div><div class="lb-score">' + e.score + '</div></div>';
  }).join("");
}

/* ==================== TUTORIAL ==================== */

function showTutorial(){ obReturn="back"; ui.screen="onboarding"; renderOnboarding(0); }

/* ==================== INIT ==================== */

(async function init(){
  var results = await Promise.all([loadProfile(), getCompletions()]);
  profileName = results[0];
  completionsCache = results[1] || {};
  if(!profileName){ ui.screen = "gate"; renderGate(false); }
  else { ui.screen = "home"; renderHome(); }
})();
</script>
