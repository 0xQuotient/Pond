<title>The Phish Store</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Spline+Sans+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    color-scheme:dark;
    /* surface ladder — near-black, never pure black */
    --bg:#0F1112;
    --surface-0:#0F1112;
    --panel:#151819;
    --panel-2:#1A1E20;
    --panel-3:#22272A;
    --line:#2A3034;
    --line-soft:#1E2326;
    /* text ladder */
    --ink:#ECEBE6;
    --ink-mid:#B3B5AE;
    --ink-dim:#878B86;
    --ink-faint:#5E635F;
    /* one accent: HTB blue */
    --accent:#F0C419;
    --accent-bright:#FFD84D;
    --accent-dim:#5A4A0A;
    --accent-glow:rgba(240,196,25,.14);
    /* legacy aliases kept so existing rules still resolve */
    --amber:#F0C419;
    --amber-dim:#5A4A0A;
    --red:#F0675C;
    --green:#59C98A;
    --sans:"Schibsted Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:"Spline Sans Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --ease:cubic-bezier(.16,1,.3,1);
    --ease-spring:cubic-bezier(.34,1.56,.64,1);
    --r-sm:6px; --r-md:8px; --r-lg:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  #root{min-height:100vh;}
  .mono{font-family:var(--mono);}

  ::selection{background:rgba(240,196,25,.35);color:var(--ink);}
  html{scrollbar-width:thin;scrollbar-color:var(--line) transparent;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;border:2px solid var(--bg);}
  ::-webkit-scrollbar-thumb:hover{background:var(--amber-dim);}

  @keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
  @keyframes screenIn{ from{opacity:0; transform:translateY(14px) scale(.995);} to{opacity:1; transform:translateY(0) scale(1);} }
  .screen-anim{ animation:screenIn .5s var(--ease) both; }
  @keyframes riseIn{ from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:translateY(0);} }
  .stagger>*{ animation:riseIn .5s var(--ease) both; }
  .stagger>*:nth-child(1){animation-delay:.04s;} .stagger>*:nth-child(2){animation-delay:.09s;}
  .stagger>*:nth-child(3){animation-delay:.14s;} .stagger>*:nth-child(4){animation-delay:.19s;}
  .stagger>*:nth-child(5){animation-delay:.24s;} .stagger>*:nth-child(6){animation-delay:.29s;}
  @media (prefers-reduced-motion:reduce){ *{animation-duration:.001s!important;transition-duration:.001s!important;} }

  /* ---------- SELECT SCREEN ---------- */
  .select-wrap{max-width:880px;margin:0 auto;padding:44px 20px 24px;}
  .brand{display:flex;align-items:baseline;gap:10px;margin-bottom:6px;flex-wrap:wrap;}
  .brand-mark{width:9px;height:16px;background:var(--amber);border-radius:0;flex-shrink:0;animation:blink 1.1s step-end infinite;}
  .brand h1{font-size:21px;margin:0;letter-spacing:.02em;font-weight:700;font-family:var(--mono);color:var(--ink);}
  .brand span{color:var(--ink-dim);font-size:13.5px;}
  .tagline{color:var(--ink-dim);font-size:14.5px;line-height:1.6;max-width:520px;margin:14px 0 10px;}
  .progress-line{font-size:12px;color:var(--ink-dim);margin:0 0 28px;}

  .section-label{font-size:11px;color:var(--ink-dim);margin:0 0 10px;font-weight:600;letter-spacing:.01em;font-family:var(--mono);}
  .tut-section-gap{margin-top:30px;}

  .mode-row{display:flex;flex-direction:column;gap:10px;margin-bottom:40px;}
  .mode-btn{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);padding:14px 15px;border-radius:4px;cursor:pointer;text-align:left;transition:background-color .15s var(--ease), transform .12s var(--ease), border-color .15s var(--ease);}
  .mode-btn:hover{background:#22272A;}
  .mode-btn:active{background:var(--panel-2);}
  .mode-btn.active{background:rgba(240,196,25,.09);border-color:var(--amber-dim);border-left:3px solid var(--amber);}
  .mode-btn strong{display:block;font-size:15px;margin-bottom:3px;}
  .mode-btn small{color:var(--ink-dim);font-size:12.5px;}

  .case-list{display:flex;flex-direction:column;gap:9px;margin-bottom:40px;}
  .case-row{display:flex;align-items:center;gap:14px;padding:13px 15px;background:var(--panel);cursor:pointer;border-radius:3px;border:1px solid var(--line);border-left:3px solid var(--line);transition:background-color .15s var(--ease), transform .12s var(--ease), box-shadow .15s var(--ease), border-color .15s var(--ease);}
  .case-row:active{background:var(--panel-2);}
  .case-row:hover{background:#22272A;}
  .case-row.active{background:rgba(240,196,25,.09);border-color:var(--amber-dim);border-left:3px solid var(--amber);}
  .case-id{font-family:var(--mono);font-size:11.5px;color:var(--ink-dim);width:58px;flex-shrink:0;}
  .case-body strong{font-size:14px;display:block;margin-bottom:2px;}
  .case-body span{font-size:12.5px;color:var(--ink-dim);}
  .case-cleared{color:var(--green);font-family:var(--mono);font-size:11px;margin-left:8px;font-weight:400;}

  .diff-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:40px;}
  .diff-card{position:relative;background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--line);border-radius:3px;padding:13px;cursor:pointer;text-align:left;transition:background-color .15s var(--ease), transform .12s var(--ease), border-color .15s var(--ease);}
  .diff-card:hover{background:#22272A;}
  .diff-card:active{background:var(--panel-2);}
  .diff-card.active{background:rgba(240,196,25,.09);border-color:var(--amber-dim);border-top:2px solid var(--amber);}
  .diff-name{font-size:13.5px;font-weight:700;margin-bottom:7px;}
  .diff-meta{font-size:11px;color:var(--ink-dim);font-family:var(--mono);line-height:1.85;}
  .diff-dots{display:flex;gap:3px;margin-top:8px;}
  .diff-dot{width:12px;height:4px;border-radius:2px;background:var(--line);transition:background-color .25s var(--ease);}
  .diff-dot.on{background:var(--amber);}
  .diff-check{position:absolute;top:8px;right:10px;color:var(--green);font-size:13px;font-weight:700;opacity:1;transform:scale(1);transition:opacity .2s var(--ease), transform .25s var(--ease-spring);}
  .diff-check-hidden{opacity:0;transform:scale(.4);}

  .launch-btn{width:100%;padding:13px 16px;background:var(--accent);color:#16130A;border:1px solid var(--accent-bright);border-radius:var(--r-sm);font-size:12.5px;font-weight:700;letter-spacing:.1em;cursor:pointer;font-family:var(--mono);transition:background-color .15s var(--ease),transform .12s var(--ease),box-shadow .15s var(--ease);}
  .launch-btn:hover{background:var(--accent-bright);transform:translateY(-1px);}
  .launch-btn:active{transform:translateY(0);}
  .launch-btn:active{background:#C79F0B;}

  .step-block{margin-bottom:34px;animation:stepIn .45s var(--ease) both;}
  @keyframes stepIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  .step-head{display:flex;align-items:center;gap:9px;margin:0 0 12px;}
  .step-num{width:22px;height:22px;border-radius:50%;background:var(--amber);color:#16130A;font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .step-head .section-label{margin:0;}
  .chosen-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel-2);border-radius:4px;padding:12px 14px;margin-bottom:12px;}
  .chosen-bar .cb-txt{font-size:13.5px;font-weight:600;}
  .chosen-bar .cb-sub{font-size:11.5px;color:var(--ink-dim);display:block;margin-top:2px;font-weight:400;}
  .cb-change{background:none;border:none;color:var(--amber);font-size:12px;font-weight:700;cursor:pointer;letter-spacing:.01em;flex-shrink:0;}
  .profile-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel-2);border-radius:4px;padding:11px 14px;margin-bottom:22px;}
  .profile-bar .pb-name{font-size:13.5px;font-weight:700;}
  .profile-bar .pb-label{font-size:10.5px;color:var(--ink-dim);letter-spacing:.01em;display:block;}
  .gate-wrap{max-width:420px;margin:0 auto;padding:90px 20px;text-align:center;}
  .gate-input{width:100%;background:var(--panel-2);border:none;border-bottom:4px solid #070A0F;border-radius:4px;padding:15px;color:var(--ink);font-size:16px;font-family:var(--sans);text-align:center;margin:22px 0 14px;}
  .gate-input:focus{outline:none;}
  .gate-err{color:var(--red);font-size:12.5px;min-height:17px;margin-bottom:10px;}
  .you-row{}
  .link-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap;}
  .lb-link{background:none;border:none;color:var(--ink-dim);font-size:13px;cursor:pointer;text-decoration:underline;padding:0;transition:color .15s var(--ease);}
  .lb-link:hover{color:var(--amber);}
  .link-sep{color:var(--line);font-size:13px;}

  @media (min-width:600px){ .mode-row{flex-direction:row;} .mode-btn{flex:1;} }
  @media (min-width:820px){ .diff-grid{grid-template-columns:repeat(5,1fr);} }

  /* ---------- CALL SCREEN ---------- */
  .call-wrap{display:grid;grid-template-columns:1fr;min-height:100vh;}
  @media (min-width:820px){ .call-wrap{grid-template-columns:1fr 300px;} }
  .transcript-col{display:flex;flex-direction:column;border-right:1px solid var(--line);min-height:60vh;}
  .call-header{padding:14px 18px;border-bottom:1px solid var(--line);}
  .call-header .who strong{font-size:15px;display:block;}
  .call-header .who span{font-size:11.5px;color:var(--ink-dim);font-family:var(--mono);}
  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--red);display:inline-block;margin-right:6px;animation:pulse 1.4s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  .stage-pill{font-family:var(--mono);font-size:10px;color:var(--amber);border:1px solid var(--amber-dim);border-radius:3px;padding:2px 7px;margin-left:6px;}

  .msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth;}
  @keyframes msgIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  .msg{max-width:82%;padding:11px 14px;border-radius:4px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;animation:msgIn .3s var(--ease) both;}
  .msg.npc{background:var(--panel);align-self:flex-start;border:1px solid var(--line);border-bottom-left-radius:4px;}
  .msg.me{background:var(--amber-dim);align-self:flex-end;color:#FFF1B8;border-bottom-right-radius:4px;}
  .msg.sys{align-self:center;color:var(--ink-dim);font-size:11.5px;font-family:var(--mono);text-align:center;max-width:100%;white-space:normal;}
  .msg .tag{display:block;font-size:10px;letter-spacing:.04em;opacity:.55;margin-bottom:4px;}

  .typing-dots{display:inline-flex;gap:3px;align-items:center;padding:3px 0;}
  .typing-dots span{width:5px;height:5px;border-radius:50%;background:var(--ink-dim);animation:typingBounce 1.2s infinite ease-in-out;}
  .typing-dots span:nth-child(2){animation-delay:.15s;}
  .typing-dots span:nth-child(3){animation-delay:.3s;}
  @keyframes typingBounce{0%,60%,100%{transform:translateY(0);opacity:.5;} 30%{transform:translateY(-4px);opacity:1;}}

  .composer{border-top:1px solid var(--line);padding:14px 18px;display:flex;gap:9px;}
  .composer input{flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:11px 13px;color:var(--ink);font-size:14px;font-family:var(--sans);transition:border-color .15s var(--ease), box-shadow .15s var(--ease);}
  .composer input:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px rgba(240,196,25,.15);}
  .composer input::placeholder{color:var(--ink-dim);}
  .composer button{background:var(--amber);color:#16130A;border:none;border-radius:3px;padding:0 18px;font-weight:700;cursor:pointer;transition:background-color .15s var(--ease), transform .15s var(--ease);}
  .composer button:hover:not(:disabled){background:#FFD84D;}
  .composer button:active:not(:disabled){transform:scale(.96);}
  .composer button:disabled{background:var(--line);color:var(--ink-dim);cursor:not-allowed;}
  .composer.email{flex-direction:column;align-items:stretch;}
  .subject-input{background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:10px 12px;color:var(--ink);font-size:13px;font-family:var(--sans);width:100%;margin-bottom:8px;transition:border-color .15s var(--ease), box-shadow .15s var(--ease);}
  .subject-input:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px rgba(240,196,25,.15);}
  .subject-input:disabled{opacity:.55;}
  .composer.email textarea{min-height:72px;resize:vertical;background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:11px 13px;color:var(--ink);font-size:14px;font-family:var(--sans);transition:border-color .15s var(--ease), box-shadow .15s var(--ease);}
  .composer.email textarea:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px rgba(240,196,25,.15);}
  .send-row{display:flex;justify-content:flex-end;margin-top:8px;}

  .hud-col{background:linear-gradient(180deg, var(--panel), var(--panel-2));padding:18px 16px;display:flex;flex-direction:column;gap:18px;}
  .hud-block h4{font-size:10.5px;letter-spacing:.01em;color:var(--ink-dim);margin:0 0 9px;font-weight:600;}
  .timer-val{font-family:var(--mono);font-size:28px;font-weight:700;transition:color .3s var(--ease);}
  @keyframes timerPulse{0%,100%{opacity:1;}50%{opacity:.5;}}
  .timer-val.warn{color:var(--red);animation:timerPulse 1s ease-in-out infinite;}
  .gauge-track{height:8px;background:var(--panel-2);border-radius:4px;overflow:hidden;border:1px solid var(--line);}
  .gauge-fill{height:100%;background:var(--green);transition:width .5s var(--ease), background-color .5s var(--ease), box-shadow .5s var(--ease);}
  .gauge-num{font-family:var(--mono);font-size:12px;color:var(--ink-dim);margin-top:6px;}
  .objective-box{background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:11px 13px;font-size:12.5px;line-height:1.6;color:var(--ink-dim);}
  .log-list{display:flex;flex-direction:column;gap:6px;font-family:var(--mono);font-size:11px;color:var(--ink-dim);}
  .quit-btn{margin-top:auto;background:transparent;border:1px solid var(--line);color:var(--ink-dim);border-radius:3px;padding:10px;font-size:12.5px;cursor:pointer;transition:border-color .15s var(--ease), color .15s var(--ease), transform .15s var(--ease);}
  .quit-btn:hover{border-color:var(--red);color:var(--red);}
  .quit-btn:active{transform:scale(.97);}
  .dossier-btn{width:100%;background:var(--panel-2);border:1px solid var(--amber-dim);color:var(--amber);border-radius:3px;padding:9px;font-size:12px;cursor:pointer;transition:border-color .15s var(--ease), transform .15s var(--ease);}
  .dossier-btn:hover{border-color:var(--amber);}
  .dossier-btn:active{transform:scale(.97);}

  /* ---------- WORKSPACE OS (Kali/Burp skin) ---------- */
  /* --- SITE SHELL (outer website) --- */
  @keyframes gridDrift{ from{background-position:0 0;} to{background-position:44px 44px;} }
  .site{min-height:100vh;position:relative;background:
      radial-gradient(1100px 500px at 78% -8%, rgba(240,196,25,.06), transparent 60%),
      radial-gradient(900px 460px at 8% 108%, rgba(255,154,90,.05), transparent 55%),
      #0C0E0F;
    display:flex;flex-direction:column;
    --k-line:#2A3034; --k-panel:#151819; --k-bar:#0F1112; --k-accent:#F0C419; --k-accent2:#F0C419;}
  .site::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
    background-image:linear-gradient(var(--line-soft) 1px,transparent 1px),linear-gradient(90deg,var(--line-soft) 1px,transparent 1px);
    background-size:44px 44px;mask-image:radial-gradient(ellipse 80% 55% at 50% 0%,#08090A 0%,transparent 75%);
    -webkit-mask-image:radial-gradient(ellipse 80% 55% at 50% 0%,#08090A 0%,transparent 75%);animation:gridDrift 24s linear infinite;}
  .site>*{position:relative;z-index:1;}
  .site-header{display:flex;align-items:center;gap:16px;padding:0 24px;height:56px;flex-shrink:0;
    background:rgba(10,12,16,.72);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border-bottom:1px solid var(--line-soft);position:sticky;top:0;z-index:30;}
  .site-logo{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-weight:700;letter-spacing:.01em;font-size:13px;color:var(--ink);}
  .site-logo .mk{color:var(--k-accent);font-size:16px;}
  .site-logo .sub{color:#5E635F;font-weight:600;letter-spacing:.1em;font-size:9.5px;}
  .site-nav{display:flex;gap:4px;margin-left:8px;}
  .site-nav a{font-family:var(--sans);font-weight:500;font-size:13px;color:var(--ink-dim);text-decoration:none;padding:7px 13px;border-radius:8px;cursor:pointer;transition:background-color .15s var(--ease),color .15s var(--ease);}
  .site-nav a:hover{background:#1A1E20;color:#F4F3EE;}
  .site-nav a.here{color:var(--accent);background:var(--accent-glow);}
  .site-spacer{flex:1;}
  .site-user{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:12px;color:#B3B5AE;}
  .site-user .av{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#332B0B,#4A3E0E);display:flex;align-items:center;justify-content:center;color:#FFD84D;font-weight:800;font-size:12px;}
  .site-stage{flex:1;display:flex;flex-direction:column;padding:20px 22px 26px;min-height:0;}
  .site-crumb{font-family:var(--mono);font-size:11px;color:#727772;margin-bottom:12px;}
  .site-crumb b{color:#9A9E98;font-weight:600;}
  .site-crumb .sep{margin:0 7px;color:#31383F;}

  /* --- HOME / LANDING --- */
  .home-stage{max-width:920px;margin:0 auto;width:100%;padding:8px 22px 60px;}
  .hero{padding:44px 0 36px;text-align:center;}
  .hero-badge{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;letter-spacing:.01em;color:var(--accent);border:1px solid var(--accent-dim);background:var(--accent-glow);padding:7px 14px;border-radius:20px;margin-bottom:24px;}
  .hero-badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);}
  .hero-h1{font-size:56px;line-height:1.0;letter-spacing:-.035em;margin:0 0 18px;color:var(--ink);font-weight:800;}
  .hero-sub{font-size:16px;line-height:1.6;color:#9A9E98;max-width:560px;margin:0 auto 28px;}
  .hero-cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  .hero-btn{width:auto!important;padding:15px 30px!important;font-size:14px!important;}
  .hero-btn2{background:transparent;color:#D6D6D0;border:1px solid #3D4549;border-radius:12px;padding:15px 26px;font-family:var(--sans);font-weight:700;font-size:14px;cursor:pointer;transition:border-color .15s,background-color .15s;}
  .hero-btn2:hover{border-color:var(--k-accent);background:#12181E;}
  .hero-btn2.sm{padding:9px 16px;font-size:12.5px;}
  .home-rankcard{display:flex;align-items:center;justify-content:space-between;gap:20px;background:linear-gradient(120deg,var(--panel-2),var(--surface-0));border:1px solid var(--line);border-radius:var(--r-lg);padding:22px 26px;margin-bottom:44px;flex-wrap:wrap;}
  .hr-left{display:flex;flex-direction:column;gap:3px;}
  .hr-label{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:#727772;}
  .hr-rank{font-size:24px;font-weight:800;color:var(--k-accent);letter-spacing:-.01em;}
  .hr-tag{font-size:12.5px;color:#878B86;}
  .hr-right{flex:1;min-width:220px;}
  .hr-prog{height:9px;background:#0C0E0F;border:1px solid #1E2326;border-radius:5px;overflow:hidden;margin-bottom:8px;}
  .hr-progfill{height:100%;background:linear-gradient(90deg,var(--k-accent),#FFD84D);border-radius:5px;transition:width .6s var(--ease);}
  .hr-progtxt{font-family:var(--mono);font-size:11.5px;color:#9A9E98;}
  .home-h2{font-size:14px;letter-spacing:.01em;color:#9A9E98;font-weight:700;margin:0 0 16px;}
  .home-modes{display:flex;flex-direction:column;gap:12px;}
  .home-mode{display:flex;align-items:center;gap:18px;background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r-lg);padding:20px 22px;cursor:pointer;position:relative;overflow:hidden;transition:border-color .18s var(--ease),transform .18s var(--ease),background-color .18s var(--ease),box-shadow .18s var(--ease);}
  .home-mode:hover{border-color:var(--accent-dim);background:var(--panel-2);transform:translateY(-2px);}
  .hm-ic{width:46px;height:46px;border-radius:12px;background:#0F1112;border:1px solid #2A3034;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--k-accent);flex-shrink:0;}
  .hm-body{flex:1;min-width:0;}
  .hm-body h3{margin:0 0 3px;font-size:16px;color:#F4F3EE;font-weight:700;}
  .hm-body p{margin:0 0 9px;font-size:12.5px;color:#878B86;}
  .hm-bar{height:5px;background:#0C0E0F;border-radius:3px;overflow:hidden;max-width:280px;margin-bottom:5px;}
  .hm-fill{height:100%;background:var(--k-accent);border-radius:3px;transition:width .5s var(--ease);}
  .hm-stat{font-family:var(--mono);font-size:11px;color:#727772;}
  .hm-go{font-size:20px;color:#4A5357;flex-shrink:0;}
  .home-mode:hover .hm-go{color:var(--k-accent);}

  /* --- PROFILE --- */
  .pf-hero{display:flex;align-items:center;gap:20px;margin:6px 0 28px;}
  .pf-av{width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,#332B0B,#4A3E0E);display:flex;align-items:center;justify-content:center;color:#9FDBF5;font-weight:800;font-size:28px;flex-shrink:0;}
  .pf-id h1{margin:0 0 4px;font-size:26px;color:#F4F3EE;letter-spacing:-.01em;}
  .pf-rankline{font-size:13px;color:#9A9E98;margin-bottom:10px;}
  .pf-rank{color:var(--k-accent);font-weight:700;}
  .pf-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:36px;}
  .pf-stat{background:#151819;border:1px solid #1E2326;border-radius:14px;padding:18px;text-align:center;}
  .pf-stat .v{display:block;font-size:26px;font-weight:800;color:#F4F3EE;}
  .pf-stat .k{display:block;font-size:10.5px;letter-spacing:.01em;color:#727772;margin-top:4px;}
  .pf-modes{display:flex;flex-direction:column;gap:11px;margin-bottom:36px;}
  .pf-mode{display:flex;align-items:center;gap:14px;}
  .pf-mode-name{width:130px;font-size:13px;color:#D6D6D0;font-weight:600;flex-shrink:0;}
  .pf-mode-stat{color:#9A9E98;font-size:12px;width:44px;text-align:right;}
  .pf-matrix{display:flex;flex-direction:column;gap:22px;}
  .mx-group h4{margin:0 0 10px;font-size:12px;letter-spacing:.01em;color:var(--k-accent);}
  .mx-row,.mx-head{display:flex;align-items:center;gap:12px;margin-bottom:5px;}
  .mx-label{width:150px;font-size:12px;color:#9A9E98;flex-shrink:0;text-align:right;}
  .mx-cells{display:flex;gap:5px;}
  .mx-cell{width:34px;height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:#0E1216;border:1px solid #1E2326;color:#4A5357;}
  .mx-cell.full{background:rgba(78,154,107,.16);border-color:#2E5A3E;color:#5FB77E;}
  .mx-cell.assist{background:rgba(255,154,90,.13);border-color:#5A431A;color:#FF9A5A;}
  .mx-dh{width:34px;text-align:center;font-family:var(--mono);font-size:9.5px;letter-spacing:.01em;color:#727772;}

  /* --- ONBOARDING --- */
  .ob-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px;background:radial-gradient(900px 500px at 50% 0%, rgba(240,196,25,.06), transparent 60%), #0C0E0F;}
  .ob-card{max-width:460px;width:100%;background:linear-gradient(160deg,#151819,#0D1216);border:1px solid #1E2326;border-radius:20px;padding:40px 34px;text-align:center;}
  .ob-ic{width:64px;height:64px;margin:0 auto 22px;border-radius:16px;background:#0F1112;border:1px solid #234655;display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--k-accent);}
  .ob-h{font-size:24px;color:#F4F3EE;margin:0 0 14px;letter-spacing:-.02em;font-weight:800;}
  .ob-p{font-size:14.5px;line-height:1.65;color:#9A9E98;margin:0 0 26px;}
  .ob-dots{display:flex;gap:7px;justify-content:center;margin-bottom:26px;}
  .ob-dot{width:7px;height:7px;border-radius:50%;background:#30373B;transition:background-color .2s,width .2s;}
  .ob-dot.on{background:var(--k-accent);width:22px;border-radius:4px;}
  .ob-card.wide{max-width:520px;}
  .ob-extra{text-align:left;margin:0 0 24px;max-height:38vh;overflow-y:auto;}
  .ob-extra .tut-tip{margin-bottom:8px;}
  .ob-cta{display:flex;gap:10px;}
  .ob-cta .hero-btn2{flex:1;}
  .ob-next{flex:2;}

  @media (max-width:600px){ .hero-h1{font-size:38px;} .mx-label{width:90px;} .mx-cell,.mx-dh{width:26px;} }

  /* --- CONSOLE (the framed toolkit window) --- */
  .os-wrap{display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden;background:#0C0E0F;
    border:1px solid #222A32;border-radius:12px;
    --k-line:#2A3034; --k-panel:#151819; --k-bar:#0F1112; --k-accent:#F0C419; --k-accent2:#F0C419;}
  .os-bar{display:flex;align-items:center;gap:12px;padding:0 14px;height:38px;background:linear-gradient(180deg,#1E2326,#151819);
    border-bottom:1px solid #08090A;flex-shrink:0;border-radius:11px 11px 0 0;}
  .os-brand{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.01em;color:#878B86;flex-shrink:0;}
  .os-logo{color:var(--k-accent);font-size:13px;line-height:1;}
  .os-div{width:1px;height:16px;background:#2A3034;flex-shrink:0;}
  .os-winlbl{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.01em;color:#5E635F;}
  .os-title{font-family:var(--mono);font-size:11px;color:#7D8896;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .os-title b{color:#D6D6D0;font-weight:600;}
  .os-spacer{flex:1;}
  .os-stat{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11.5px;color:#B3B5AE;}
  .os-stat .lbl{color:#727772;font-size:9.5px;letter-spacing:.01em;}
  .os-timer{font-weight:700;font-size:14px;color:#D6D6D0;transition:color .3s var(--ease);}
  .os-timer.warn{color:#F0675C;animation:timerPulse 1s ease-in-out infinite;}
  .os-gauge{width:80px;height:6px;background:#0C0E0F;border:1px solid #2A3034;border-radius:2px;overflow:hidden;}
  .os-gauge-fill{height:100%;background:var(--green);border-radius:inherit;transition:width .55s var(--ease),background-color .45s var(--ease);position:relative;overflow:hidden;}
  .os-gauge-fill::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);transform:translateX(-100%);animation:shimmer 2.4s ease-in-out infinite;}
  @keyframes shimmer{ 0%{transform:translateX(-100%);} 60%,100%{transform:translateX(200%);} }

  .os-body{flex:1;display:flex;min-height:0;}
  .os-dock{width:66px;background:linear-gradient(180deg,#10151A,#0B0F13);border-right:1px solid #08090A;display:flex;flex-direction:column;align-items:stretch;padding:0;flex-shrink:0;}
  .dock-title{font-family:var(--mono);font-size:7.5px;letter-spacing:.01em;color:#5E635F;text-align:center;padding:8px 0 6px;border-bottom:1px solid #1E2326;font-weight:700;}
  .dock-btn{width:100%;height:52px;background:transparent;border:none;border-left:3px solid transparent;border-bottom:1px solid #1E2326;color:#878B86;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:8px;
    letter-spacing:.01em;font-weight:700;font-family:var(--mono);transition:background-color .12s linear, color .12s linear, border-color .12s linear;}
  .dock-btn .ic{font-size:15px;line-height:1;}
  .dock-btn:hover{background:#1A1E20;color:#D6D6D0;}
  .dock-btn.active{background:#151819;color:var(--k-accent);border-left-color:var(--k-accent);}
  .dock-btn.active .ic{filter:drop-shadow(0 0 6px rgba(240,196,25,.4));}
  .dock-sp{flex:1;border-bottom:none;}
  .dock-btn.danger{color:#9A6A60;}
  .dock-btn.danger:hover{background:#2A1614;color:#F0675C;border-left-color:#F0675C;}

  .os-panel{width:300px;background:#151819;border-right:1px solid #08090A;display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;}
  .panel-head{padding:0 12px;height:29px;display:flex;align-items:center;gap:7px;background:linear-gradient(180deg,#1E2326,#1A1E20);
    border-bottom:1px solid #08090A;font-family:var(--mono);font-size:10px;letter-spacing:.01em;color:#9A9E98;font-weight:700;flex-shrink:0;}
  .panel-head:before{content:"";width:7px;height:7px;border-radius:1px;background:var(--k-accent);flex-shrink:0;}
  .panel-body{flex:1;overflow-y:auto;padding:12px;font-size:12px;line-height:1.6;color:#9A9E98;font-family:var(--mono);}
  .panel-body p{margin:0 0 10px;}
  .panel-body strong{color:#D6D6D0;font-weight:600;}
  .panel-body h5{color:var(--k-accent);font-size:9.5px;letter-spacing:.01em;margin:15px 0 6px;font-weight:700;
    border-bottom:1px solid #1E2326;padding-bottom:5px;}
  .panel-body h5:first-child{margin-top:0;}
  .p-card{background:#0E1011;border:1px solid #1E2326;border-left:2px solid #30373B;border-radius:2px;padding:9px 10px;margin-bottom:7px;font-size:11.5px;color:#B3B5AE;}
  .notes-area{width:100%;min-height:230px;background:#0C0E0F;border:1px solid #1E2326;border-radius:2px;padding:10px;color:#D6D6D0;
    font-size:12px;font-family:var(--mono);resize:vertical;line-height:1.6;}
  .notes-area:focus{outline:none;border-color:var(--k-accent);box-shadow:0 0 0 2px rgba(240,196,25,.15);}
  .os-main{flex:1;display:flex;flex-direction:column;min-width:0;background:#0C0E0F;}
  .os-main .msgs{background:#0C0E0F;}
  .os-main .msg.npc{background:#1A1E20;border:1px solid #1E2326;border-radius:3px;}
  .os-main .msg.me{background:#17313F;color:#FFF1B8;border:1px solid #3F350D;border-radius:3px;}
  .os-main .msg.sys{color:#727772;font-family:var(--mono);}
  .os-main .composer{background:#0D1114;border-top:1px solid #08090A;}
  .os-main .composer input,.os-main .composer textarea,.os-main .subject-input{background:#0C0E0F;border:1px solid #1E2326;border-radius:2px;color:#D6D6D0;font-family:var(--mono);font-size:12.5px;}
  .os-main .composer input:focus,.os-main .composer textarea:focus,.os-main .subject-input:focus{border-color:var(--k-accent);box-shadow:0 0 0 2px rgba(240,196,25,.15);}
  .os-main .composer button{background:#1E2326;color:#D6D6D0;border:1px solid #3D4549;border-radius:2px;font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.01em;}
  .os-main .composer button:hover:not(:disabled){background:#30373B;border-color:var(--k-accent);color:#fff;}
  .os-main .composer button:disabled{background:#151819;color:#5E635F;border-color:#1E2326;}
  .os-main .log-list{font-family:var(--mono);color:#9A9E98;}
  @media (max-width:820px){
    .os-panel{position:absolute;left:58px;top:0;bottom:0;z-index:20;}
    .os-panel.collapsed{display:none;}
    .os-body{position:relative;}
  }
  /* ---------- CAMPAIGN WORKSPACE ---------- */
  .wk-cl-hint{text-transform:none;letter-spacing:0;font-weight:400;color:#727772;font-size:11px;margin-left:8px;}
  .wk-go.primary{background:var(--k-accent);color:#16130A;border-color:var(--k-accent);border-left-color:#FFD84D;font-size:13px;padding:14px 26px;}
  .wk-go.primary:hover:not(:disabled){background:#FFD84D;color:#16130A;}
  .os-work{flex:1;overflow-y:auto;background:#0C0E0F;padding:28px 32px;min-width:0;}
  .wk-head{margin-bottom:24px;border-bottom:1px solid #1E2326;padding-bottom:16px;}
  .wk-head h2{margin:0;font-size:19px;color:#F4F3EE;font-weight:700;letter-spacing:-.02em;}
  .wk-head p{margin:5px 0 0;font-size:12.5px;color:#878B86;font-family:var(--mono);line-height:1.5;}
  .wk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;}
  .wk-card{background:#151819;border:1px solid #1E2326;border-radius:6px;padding:16px 18px;}
  .wk-card h4{margin:0 0 9px;font-size:10px;letter-spacing:.01em;color:var(--k-accent);font-weight:700;}
  .wk-card p{margin:0;font-size:12.5px;color:#B3B5AE;line-height:1.6;}
  .wk-card b{color:#D6D6D0;}
  .wk-stat-row{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap;}
  .wk-stat{flex:1;min-width:100px;background:#151819;border:1px solid #1E2326;border-radius:4px;padding:14px;text-align:center;}
  .wk-stat .v{display:block;font-size:24px;font-weight:700;color:#FF9A5A;}
  .wk-stat .k{display:block;font-size:9.5px;letter-spacing:.01em;color:#727772;margin-top:3px;}
  .wl-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid #171D23;font-size:12px;color:#9A9E98;}
  .wl-row:last-child{border-bottom:none;}
  .wl-row b{color:#D6D6D0;font-size:12px;}
  .wk-actionbar{margin-top:18px;display:flex;justify-content:flex-end;}
  .wk-go{background:#1E2326;color:#D6D6D0;border:1px solid #3D4549;border-left:3px solid var(--k-accent);border-radius:6px;padding:12px 22px;font-family:var(--mono);font-size:12.5px;font-weight:700;cursor:pointer;letter-spacing:.04em;transition:background-color .12s,border-color .12s,color .12s;}
  .wk-go:hover:not(:disabled){background:#30373B;color:#fff;}
  .wk-go:disabled{opacity:.5;cursor:not-allowed;}
  .wk-form,.wk-compose{display:flex;flex-direction:column;gap:18px;max-width:600px;}
  .wk-form label,.wk-cl{display:flex;flex-direction:column;gap:6px;font-size:11px;letter-spacing:.01em;color:#878B86;font-weight:700;font-family:var(--mono);}
  .wk-input{background:#0C0E0F;border:1px solid #1E2326;border-radius:6px;padding:12px 14px;color:#D6D6D0;font-size:13px;font-family:var(--mono);text-transform:none;letter-spacing:0;font-weight:400;transition:border-color .12s,box-shadow .12s;}
  .wk-input:focus{outline:none;border-color:var(--k-accent);box-shadow:0 0 0 2px rgba(240,196,25,.15);}
  select.wk-input{cursor:pointer;}
  .wk-textarea{background:#0C0E0F;border:1px solid #1E2326;border-radius:6px;padding:13px 14px;color:#D6D6D0;font-size:13px;font-family:var(--mono);min-height:170px;resize:vertical;line-height:1.65;text-transform:none;letter-spacing:0;font-weight:400;transition:border-color .12s,box-shadow .12s;}
  .wk-textarea:focus{outline:none;border-color:var(--k-accent);box-shadow:0 0 0 2px rgba(240,196,25,.15);}
  .wk-textarea.tall{min-height:340px;width:100%;max-width:640px;}
  .wk-preview{margin-top:20px;max-width:560px;background:#0E1011;border:1px solid #1E2326;border-radius:4px;padding:15px;}
  .wk-preview h4{margin:0 0 10px;font-size:10px;letter-spacing:.1em;color:var(--k-accent);}
  .wk-hint{font-size:11.5px;color:#727772;line-height:1.55;font-family:var(--mono);margin-top:10px;}
  .wk-seg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:9px;}
  .wk-seg{background:#151819;border:1px solid #1E2326;border-left:3px solid transparent;border-radius:3px;padding:14px 15px;color:#B3B5AE;font-size:13px;font-family:var(--mono);cursor:pointer;text-align:left;transition:background-color .12s,border-color .12s,color .12s;}
  .wk-seg:hover{background:#1A1E20;color:#D6D6D0;}
  .wk-seg.active{background:#1A1E20;border-left-color:var(--k-accent);color:var(--k-accent);}
  .wk-linkchip{background:#0E1011;border:1px dashed #30373B;border-radius:3px;padding:9px 12px;font-size:12px;color:#9A9E98;}
  .wk-linkchip b{color:var(--k-accent);}
  .wk-linkchip span{color:#727772;font-size:11px;}
  .wk-feed{display:flex;flex-direction:column;gap:11px;}
  .wk-feed .msg{max-width:100%;animation:msgIn .3s var(--ease) both;}
  .wk-empty{background:#151819;border:1px dashed #30373B;border-radius:4px;padding:34px;text-align:center;color:#727772;font-family:var(--mono);font-size:12.5px;}
  .assist-note{color:#FF9A5A;font-size:12px;font-family:var(--mono);margin:8px auto 0;max-width:400px;line-height:1.5;}
  .diff-check.assisted-c{color:#FF9A5A;}
  .hint-warn{background:#221A0C;border:1px solid #5A4620;border-left:3px solid var(--k-accent2);border-radius:3px;padding:11px 13px;font-size:12px;color:#D9B98A;line-height:1.55;margin-bottom:14px;font-family:var(--mono);}
  .hint-warn.used{background:#2A1608;border-color:#5A3A1A;color:#FF9A5A;}
  .lb-assist{color:#FF9A5A;}
  /* ================= MOBILE ================= */
  @media (max-width:680px){
    /* site chrome */
    .site-header{padding:0 14px;height:auto;min-height:52px;flex-wrap:wrap;gap:8px 10px;padding-top:8px;padding-bottom:8px;}
    .site-nav{order:3;width:100%;margin-left:0;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;}
    .site-nav a{white-space:nowrap;padding:7px 12px;font-size:12.5px;}
    .site-logo{font-size:12px;}
    .site-user{margin-left:auto;}
    .site-stage,.home-stage{padding-left:14px;padding-right:14px;}

    /* landing */
    .hero{padding:28px 0 24px;}
    .hero-h1{font-size:34px;}
    .hero-sub{font-size:14.5px;}
    .hero-cta{flex-direction:column;}
    .hero-cta button{width:100%;}
    .home-rankcard{flex-direction:column;align-items:stretch;gap:14px;padding:18px;}
    .hm-bar{max-width:none;}

    /* profile */
    .pf-hero{gap:14px;}
    .pf-av{width:52px;height:52px;font-size:22px;}
    .pf-id h1{font-size:21px;}
    .pf-matrix{overflow-x:auto;-webkit-overflow-scrolling:touch;}
    .mx-label{width:74px;font-size:10.5px;}
    .mx-cell,.mx-dh{width:24px;}
    .mx-cell{height:24px;font-size:11px;}
    .pf-mode-name{width:88px;font-size:12px;}

    /* select / steps */
    .select-wrap{padding:14px 14px 60px;}
    .diff-grid{grid-template-columns:repeat(2,1fr)!important;}

    /* CONSOLE → stacked single column */
    .site-stage{padding:12px;}
    .os-wrap{border-radius:12px;}
    .os-bar{height:auto;min-height:38px;flex-wrap:wrap;gap:6px 10px;padding:8px 12px;}
    .os-bar .os-title{width:100%;order:5;font-size:10.5px;}
    .os-body{flex-direction:column;}
    /* dock becomes a horizontal tab strip */
    .os-dock{width:100%;flex-direction:row;overflow-x:auto;-webkit-overflow-scrolling:touch;border-right:none;border-bottom:1px solid #08090A;padding:0;}
    .dock-title{display:none;}
    .dock-btn{width:auto;min-width:62px;height:46px;border-left:none;border-bottom:3px solid transparent;flex-shrink:0;padding:0 6px;}
    .dock-btn.active{border-left:none;border-bottom-color:var(--k-accent);}
    .dock-sp{display:none;}
    .dock-btn.danger{min-width:56px;}
    /* side panel becomes a full-width sheet above the transcript */
    .os-panel{width:100%!important;position:relative!important;left:auto!important;top:auto!important;bottom:auto!important;max-height:40vh;border-right:none;border-bottom:1px solid #08090A;}
    .os-panel.collapsed{display:none;}
    .os-main{min-height:52vh;}
    .os-work{padding:18px 16px;}
    .wk-form,.wk-compose,.wk-textarea.tall,.wk-preview{max-width:none;}
    .wk-grid{grid-template-columns:1fr;}
    .msg{max-width:90%;}
    .composer{padding:12px;}
    /* end screen */
    .end-wrap{padding:44px 18px;}
    .end-stats{gap:16px;}
    /* onboarding */
    .ob-card{padding:30px 22px;}
    .ob-h{font-size:21px;}
  }
  /* ---------- END SCREEN ---------- */
  .end-wrap{max-width:560px;margin:0 auto;padding:70px 20px;text-align:center;}
  .end-status{font-size:13px;letter-spacing:.01em;font-weight:700;margin-bottom:10px;}
  .end-status.win{color:var(--green);}

function screenAnimClass(key){

function animateCountUp(el, target, duration){
  if(!el) return;
  var start = null;
  function step(ts){
    if(start===null) start = ts;
    var progress = Math.min(1, (ts-start)/duration);
    var eased = 1 - Math.pow(1-progress, 3);
    el.textContent = Math.round(eased*target);
    if(progress<1) requestAnimationFrame(step);
    else el.textContent = target;
  }
  requestAnimationFrame(step);
}

function computeScore(won, timeLeft, suspicion, diffId){
  if(!won) return 0;
  var raw = 500 + timeLeft*3 - suspicion*2;

}

async function getBoard(modeId, caseId, diffId){
  try{

async function pushToBoard(modeId, caseId, diffId, entry){
  try{
    var board = await getBoard(modeId, caseId, diffId);
    var existing = -1;
    for(var i=0;i<board.length;i++){
      if(board[i].name && board[i].name.toLowerCase() === entry.name.toLowerCase()){ existing = i; break; }
    }
    if(existing >= 0){
      if(board[existing].score >= entry.score) return true;
      board.splice(existing,1);
    }
    board.push(entry);
    board.sort(function(a,b){ return b.score-a.score; });
    var trimmed = board.slice(0,10);
    await window.storage.set("board:"+modeId+":"+caseId+":"+diffId, JSON.stringify(trimmed), true);
    return true;
  }catch(e){ return false; }
}

async function callModel(systemPrompt, history){
  var sample = await getSample();
  if(!sample) return {__error:NO_SAMPLE};
  var lead = "You are the game engine and NPC described below. Follow these instructions exactly and reply with only the JSON object they specify.\n\n" + systemPrompt;
  var input;
  if(!history.length){
    input = lead + "\n\n(The call connects. Give your first line now.)";
  } else {
    var turns = history.map(function(m){ return {role:m.role, content:m.content}; });
    turns[0] = {role:"user", content: lead + "\n\n---\nConversation so far. The next message is from the other party:\n\n" + turns[0].content};
    input = turns;
  }
  var res;
  try{ res = await sample(input, {cache:false, modelTier:"quick"}); }
  catch(e){ return {__error: classifyErr(e && e.code)}; }
  try{ return JSON.parse(stripFence(res.text)); }
  catch(e){ return {reply:"...", suspicion_delta:0, hangup:false, flag_leaked:false}; }
}

  if(name.length > 20){ if(err) err.textContent = "Keep it under 20 characters."; return; }

  else { goProfile(); }

var toastTimer = null, armed = {key:null, t:null};
function toast(msg){
  var t = document.getElementById("toast");
  if(!t){ t = document.createElement("div"); t.id = "toast"; t.className = "toast"; document.body.appendChild(t); }
  t.textContent = msg; t.style.display = "block";
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.style.display = "none"; }, 3200);
}
function confirmTwice(key, msg, fn){
  if(armed.key !== key){
    armed.key = key; toast(msg);
    clearTimeout(armed.t); armed.t = setTimeout(function(){ armed.key = null; }, 3400);
    return;
  }
  armed.key = null; clearTimeout(armed.t); fn();
}

/* ==================== MASS PHISHING (campaign) ==================== */

var campaign = null;

function diffCampaignParams(diffId){
  // maxRounds = how many refine iterations; skepticism scales how hard the population is
  var map = {
    easy:      {rounds:6, skepticism:"low",       target:35},
    medium:    {rounds:5, skepticism:"moderate",  target:40},
    hard:      {rounds:4, skepticism:"high",      target:45},
    insane:    {rounds:3, skepticism:"very high", target:50},
    impossible:{rounds:3, skepticism:"extreme, well-trained, actively suspicious", target:55}
  };
  return map[diffId] || map.medium;
}

function startCampaign(modeObj, caseObj, diff){
  var p = diffCampaignParams(diff.id);
  campaign = {
    mode:modeObj, caseObj:caseObj, diff:diff, params:p,
    round:0, rounds:[], bestClick:0, ended:false, loading:false, activeTool:"dash", notes:"",
    infra:{brand:"", subdomain:"secure", tld:".com", display:"", sender:"it-support"},
    targetSeg:"Whole population",
    lure:{subject:"", body:""},
    assisted:false, hints:[], hintLoading:false
  };
  ui.screen = "campaign";
  renderCampaignShell();
}

  return "You are the simulation engine for a fictional, consensual MASS-PHISHING awareness-training exercise (like a corporate red-team phishing drill). Everything is fictional; no real people or orgs. You model how a population of employees would respond to a phishing email the trainee wrote.\n\n" +
"FICTIONAL ORG: " + c.org + "\n" +
"POPULATION: " + c.population + "\n" +
"POPULATION SKEPTICISM LEVEL: " + p.skepticism + ". Higher skepticism means fewer clicks, more reports, and the population is harder to fool with generic or high-pressure lures.\n\n" +
"The trainee submits a spoofed sender address, a targeting choice (whole population or one segment), and the phishing email itself — a subject line (the hook) and the body. You simulate the send and estimate the outcome, segment by segment, judging realistically:\n" +
"- Sender plausibility matters: a look-alike domain and a mailbox matching the subject/theme helps; obvious mismatches hurt and raise reports.\n" +
"- If the trainee TARGETED one segment, concentrate the effect: that segment can click much higher if the lure fits, but overall click_rate should still reflect that only part of the org was well-served.\n" +

"- Generic spray-and-pray, obvious spelling/urgency/greed tells, and mismatched sender framing REDUCE clicks and INCREASE reports, especially at higher skepticism.\n" +
"- Well-targeted, plausible, low-key internal/vendor/tool-themed lures do better.\n" +
"- No single lure clicks everyone; different segments respond to different psychological levers (authority, urgency, curiosity, fear, routine/habit, reward).\n\n" +
"Return ONLY a raw JSON object (no markdown), exact shape:\n" +
'{"click_rate": <integer 0-100, percent of whole population that clicked>, "report_rate": <integer 0-100, percent who reported it as phishing>, "segments": [{"name":"<segment>","clicked":<0-100>,"note":"<short why>"}], "weakest_segment":"<name of the segment that bit hardest>", "dominant_lever":"<the psychological lever that worked best, e.g. urgency/authority/curiosity/routine>", "analyst_note":"<2-3 sentence debrief: what worked, what to change next round to raise click-rate>"}' + "\n" +

        '<label>Subdomain prefix<input class="wk-input" value="'+esc(i.subdomain)+'" oninput="setInfra(\'subdomain\',this.value)" placeholder="secure, login, mail, sso"></label>'+
        '<label>TLD'+
          '<select class="wk-input" onchange="setInfra(\'tld\',this.value)">'+
            ['.com','.net','.co','.org','.io','.support','.help'].map(function(x){return '<option '+(i.tld===x?"selected":"")+'>'+x+'</option>';}).join("")+
          '</select></label>'+
        '<label>Sender mailbox<input class="wk-input" value="'+esc(i.sender)+'" oninput="setInfra(\'sender\',this.value)" placeholder="it-support, no-reply, hr, billing"></label>'+
        '<label>Display name (optional)<input class="wk-input" value="'+esc(i.display)+'" oninput="setInfra(\'display\',this.value)" placeholder="IT Service Desk"></label>'+
      '</div>'+
      '<div class="wk-preview"><h4>Live preview</h4><div id="infra-preview">'+infraPreviewHtml()+'</div>'+
        '<p class="wk-hint">Tip: a plausible subdomain + matching mailbox on a look-alike domain reads as more legit than a random address. Obvious mismatches raise report-rates.</p></div>';
  }

  else if(t==="target"){
    var segs=["Whole population"].concat(c.segments||[]);
    w.innerHTML = toolHead("Targeting", "Aim this round at everyone, or focus a single segment you think is the weak spot.") +

async function requestCampHint(){
  if(!campaign || campaign.ended || campaign.hintLoading) return;
  campaign.hintLoading = true;
  renderCampTool();
  var c=campaign.caseObj;
  var hist = campaign.rounds.map(function(r,i){ return "Round "+(i+1)+": "+r.click+"% CTR, weakest="+r.weakest+", lever="+r.lever+", subject="+r.subject; }).join("\n");
  var sys="You are a red-team phishing coach for a training game. Give ONE short actionable hint (1-2 sentences) to raise click-through on the next round. Focus on targeting, pretext, and which segment/lever to exploit. Do not just say 'try harder'. Return ONLY the hint text.";
  var user="ORG: "+c.org+"\nPOPULATION: "+c.population+"\nBEST CTR SO FAR: "+campaign.bestClick+"%\nROUND HISTORY:\n"+(hist||"(no rounds yet)");
  var hint=await fetchTextFromModel(sys,user);
  if(!campaign||campaign.ended) return;
  campaign.hintLoading=false;
  if(hint){ campaign.hints.push(hint); campaign.assisted=true; }
  else { toast("Couldn't get a hint right now. Nothing was counted. Try again."); }
  if(campaign.activeTool==="hints") renderCampTool();
  else if(hint) toast("Hint ready in the Hints tab.");
}

function campFeed(role, html){
  campaign.resultsHtml = (campaign.resultsHtml||"") +
    '<div class="msg '+(role==="me"?"me":role==="sys"?"sys":"npc")+'">'+html+'</div>';
  var feed=document.getElementById("camp-feed");
  if(feed){ feed.innerHTML=campaign.resultsHtml; feed.scrollTo({top:feed.scrollHeight, behavior:"smooth"}); }
}

function setCampLoading(v){
  campaign.loading=v;
  var b=document.getElementById("camp-send");
  if(b){ b.disabled=v; b.textContent = v ? "Sending…" : "Launch round "+(campaign.round+1)+" →"; }
}

async function launchRound(){
  if(!campaign || campaign.loading || campaign.ended) return;
  syncComposeState();
  var subject=campaign.lure.subject.trim();
  var bodyEl=document.getElementById("camp-body");
  var bodyTxt=campaign.lure.body.trim();
  if(!bodyTxt){ setCampTool("compose"); toast("Write the email body first."); return; }

  var sentHtml = '<span class="tag">round '+(campaign.round+1)+' \u00b7 '+esc(campaign.targetSeg)+'</span>'+
    '<strong>From:</strong> '+esc(campSender())+'<br>'+
    (subject?'<strong>Subject:</strong> '+esc(subject)+'<br>':'')+
    '<div style="margin-top:6px">'+esc(bodyTxt)+'</div>';
  setCampLoading(true);

  var userMsg = "SPOOFED SENDER: "+campSender()+" (display name: "+(campaign.infra.display||"none")+")\nTARGETING: "+campaign.targetSeg+"\nSUBJECT LINE (the hook): "+(subject||"(none)")+"\nEMAIL BODY:\n"+bodyTxt;
  var r = await fetchJsonFromModel(campaignSystemPrompt(), userMsg);
  setCampLoading(false);
  if(!campaign || campaign.ended) return;
  if(!r){ toast("Couldn't reach the simulator. Your draft is kept. Try launching again."); return; }

  var click = Math.max(0, Math.min(100, Math.round(Number(r.click_rate)||0)));
  var report = Math.max(0, Math.min(100, Math.round(Number(r.report_rate)||0)));
  campFeed("me", sentHtml);
  campaign.lure.subject=""; campaign.lure.body="";
  campaign.round++;
  campaign.rounds.push({click:click, subject:subject, weakest:r.weakest_segment, lever:r.dominant_lever});
  if(click>campaign.bestClick) campaign.bestClick=click;

  var segs = Array.isArray(r.segments)? r.segments : [];
  var segHtml = segs.map(function(s){
    var v=Math.max(0,Math.min(100,Math.round(Number(s.clicked)||0)));
    return '<div style="margin:6px 0"><div style="display:flex;justify-content:space-between;font-size:11px"><span>'+esc(s.name||"?")+'</span><span class="mono">'+v+'%</span></div>'+
      '<div class="os-gauge" style="width:100%;margin-top:3px"><div class="os-gauge-fill" style="width:'+v+'%;background:'+(v>=50?"#FF9A5A":"#F0C419")+'"></div></div>'+
      (s.note?'<div style="font-size:10.5px;color:#727772;margin-top:2px">'+esc(s.note)+'</div>':'')+'</div>';
  }).join("");

  campFeed("npc", '<span class="tag">round '+campaign.round+' results</span>'+
    '<div style="display:flex;gap:18px;margin-bottom:8px"><div><div class="mono" style="font-size:22px;font-weight:700;color:#FF9A5A">'+click+'%</div><div style="font-size:10px;color:#727772;text-transform:uppercase">clicked</div></div>'+
    '<div><div class="mono" style="font-size:22px;font-weight:700;color:#59C98A">'+report+'%</div><div style="font-size:10px;color:#727772;text-transform:uppercase">reported</div></div></div>'+
    segHtml+
    '<div style="margin-top:8px;border-top:1px solid #1E2326;padding-top:8px"><strong>Weakest:</strong> '+esc(r.weakest_segment||"—")+' · <strong>Lever:</strong> '+esc(r.dominant_lever||"—")+'</div>'+
    (r.analyst_note?'<div style="margin-top:6px;color:#9A9E98">'+esc(r.analyst_note)+'</div>':''));

  var rEl=document.getElementById("camp-round"); if(rEl) rEl.textContent=campaign.round+"/"+campaign.params.rounds;
  var bEl=document.getElementById("camp-best"); if(bEl) bEl.textContent=campaign.bestClick+"%";
  if(campaign.activeTool==="compose") setCampTool("results");
  else if(campaign.activeTool==="results") renderCampTool();
  else toast("Round "+campaign.round+" results are in the Results tab.");

  if(campaign.round>=campaign.params.rounds){
    campFeed("sys", "Round limit reached. Finalizing campaign\u2026");
    setTimeout(endCampaign, 900);
  }
}

function endCampaign(){
  if(!campaign || campaign.ended) return;
  campaign.ended=true;
  var best=campaign.bestClick;
  var won = best >= campaign.params.target;
  var score = won ? Math.round(best * (DIFF_MULT[campaign.diff.id]||1) * 20) : 0;
  if(won) markComplete(campaign.mode.id, campaign.caseObj.id, campaign.diff.id, campaign.assisted);
  lastResult = {
    won:won, mode:campaign.mode, caseObj:campaign.caseObj, diff:campaign.diff,
    reason: won ? ("Peak click-rate of "+best+"% cleared the "+campaign.params.target+"% target.") : ("Best click-rate was "+best+"%. Needed "+campaign.params.target+"% to clear."),
    flag: won ? ("CTR "+best+"%") : "",
    campaignScore: score, bestClick:best, assisted:campaign.assisted, hintsUsed:campaign.hints.length,
    suspicion:0, timeLeft:0
  };
  ui.screen="end"; renderCampaignEnd();
}

function renderCampaignEnd(){
  var r=lastResult;
  var submitHtml = r.won ? '<div class="submit-row"><button id="lb-submit-btn" onclick="submitCampaignScore('+r.campaignScore+')">Submit as '+esc(profileName||"operator")+'</button></div>' : "";
  root.innerHTML = siteChrome("missions",
    '<div class="end-wrap '+screenAnimClass("end")+'">'+
      '<div class="end-status '+(r.won?"win":"lose")+'">'+(r.won?(r.assisted?"Campaign cleared · ASSISTED":"Campaign cleared"):"Campaign fell short")+'</div>'+
      (r.won&&r.assisted?'<div class="assist-note">Solved with '+r.hintsUsed+' hint'+(r.hintsUsed===1?"":"s")+'. Flagged assisted, not a full clear.</div>':"")+
      '<p style="color:var(--ink-dim);font-size:14px;">'+esc(r.reason)+'</p>'+
      (r.won?'<div class="end-flag mono">peak CTR '+r.bestClick+'%</div>':'')+
      '<div class="score-label">Score</div><div class="score-big mono" id="score-big-val">0</div>'+
      '<div class="end-stats">'+
        '<div><span class="mono">'+r.bestClick+'%</span><small>best click-rate</small></div>'+
        '<div><span class="mono">'+campaign.round+'</span><small>rounds used</small></div>'+
        '<div><span class="mono">'+esc(r.diff.name)+'</span><small>difficulty</small></div>'+
      '</div>'+
      '<div id="submit-area">'+submitHtml+'</div>'+
      endActionsHtml()+
    '</div>');
  animateCountUp(document.getElementById("score-big-val"), r.campaignScore||0, 700);
}

async function submitCampaignScore(score){
  if(!profileName) return;
  var btn=document.getElementById("lb-submit-btn");
  if(btn){ btn.disabled=true; btn.textContent="Submitting…"; }
  var ok=await pushToBoard(lastResult.mode.id, lastResult.caseObj.id, lastResult.diff.id, {name:profileName, score:score, assisted:!!lastResult.assisted});
  var area=document.getElementById("submit-area");
  if(!area) return;
  area.innerHTML = ok ? '<div class="submitted-note">&#10003; logged to '+esc(lastResult.caseObj.id)+' / '+esc(lastResult.diff.name)+' board</div>'
    : '<div class="gate-err" style="margin-bottom:22px;">Couldn\'t reach the leaderboard. Score stands but wasn\'t saved.</div>';
}

function beginFromBriefing(){

  var p = pendingLaunch;
  pendingLaunch = null;
  startCall(p.modeObj, p.caseObj, p.diff, p.dossier);
}

/* ==================== MISSION (call / email) ==================== */

function computeStagePrompt(){
  var args = call.stage==="recon" ?
    {personaDesc:call.caseObj.recon.personaDesc, objective:call.caseObj.recon.objective, secretPurpose:"a specific, useful piece of leverage information about the primary target or their environment", secretWord:"LEAK"} :
    {personaDesc:call.caseObj.persona, objective:call.caseObj.objective, secretPurpose:"the objective secret code", secretWord:"FLAG"};
  var leverage = call.stage==="main" ? call.reconIntel : null;
  return buildSystemPrompt(call.mode, args.personaDesc, args.objective, args.secretPurpose, args.secretWord, call.diff, leverage);
}
function secretRegexFor(stage){ return stage==="recon" ? /LEAK\{([^}]+)\}/ : /FLAG\{[^}]+\}/; }

function startCall(modeObj, caseObj, diff, dossier){
  var startStage = diff.reconSeconds>0 ? "recon" : "main";
  call = {
    mode:modeObj, caseObj:caseObj, diff:diff, dossier:dossier||null,
    stage:startStage, reconIntel:null, subjectLine:null, systemPrompt:"",
    history:[], suspicion:(diff.startSusp!=null?diff.startSusp:20), seconds: startStage==="recon" ? diff.reconSeconds : diff.seconds,
    loading:true, ended:false, timerId:null, log:[], trail:[], activeTool:((window.matchMedia && window.matchMedia("(max-width:680px)").matches) ? null : "objective"), notes:"", assisted:false, hints:[], hintLoading:false, capturedFlag:null, flagTries:[]
  };
  call.systemPrompt = computeStagePrompt();
  ui.screen = "call";
  renderCallShell();
  beginStage();
  call.timerId = setInterval(tick, 1000); activeTimerId = call.timerId;
}

function beginStage(){
  if(call.mode.interaction==="call"){
    openingLine();
  } else {
    setLoading(false);
    focusComposer();
  }
}

function renderCallShell(){
  var stageBadge = call.diff.reconSeconds>0 ? (call.stage==="recon" ? " · STAGE 1/2 RECON" : " · STAGE 2/2 PRIMARY") : "";
  var headerName = call.stage==="recon" ? (call.caseObj.recon.label||"Recon Contact") :
    (call.caseObj.targetName ? (call.caseObj.targetName + " — " + call.caseObj.targetRole) : ((TARGET_CARDS[call.caseObj.id]||{}).who || call.caseObj.name));

  var composerHtml;
  if(call.mode.interaction==="email"){
    composerHtml =
      '<div class="composer email">' +
        '<input id="composer-subject" class="subject-input" placeholder="Subject line…">' +
        '<textarea id="composer-body" placeholder="write the email…"></textarea>' +

      '</div>';
  } else {
    composerHtml =
      '<div class="composer">' +
        '<input id="composer-input" disabled placeholder="target is responding…" onkeydown="if(event.key===\'Enter\') sendMsg();">' +
        '<button id="send-btn" onclick="sendMsg()" disabled>Send</button>' +
      '</div>';

    {id:"objective", ic:ico("brief"), label:"Brief"},

  if(!call.diff.forgiving) tools.push({id:"flag", ic:ico("flag"), label:"Flag"});
  tools.push({id:"hints", ic:ico("bulb"), label:"Hints"});

  var dockHtml = tools.map(function(t){
    return '<button class="dock-btn ' + (call.activeTool===t.id?"active":"") + '" onclick="setTool(\'' + t.id + '\')">' +
      '<span class="ic">' + t.ic + '</span>' + t.label + '</button>';
  }).join("");

  root.innerHTML = siteShell(esc(call.mode.name) + " " + esc(call.caseObj.id),
    '<div class="os-wrap ' + screenAnimClass("call-"+call.stage) + '">' +
      '<div class="os-bar">' +
        '<span class="os-winlbl">CONSOLE</span><div class="os-div"></div>' +
        '<div class="os-title"><b>' + esc(headerName) + '</b> — ' + esc(call.caseObj.id) + ' · ' + esc(call.mode.name.toLowerCase()) + esc(stageBadge) + '</div>' +
        '<div class="os-spacer"></div>' +
        '<div class="os-stat"><span class="lbl">Susp</span><div class="os-gauge"><div class="os-gauge-fill" id="gauge-fill" style="width:' + call.suspicion + '%"></div></div><span id="gauge-num">' + call.suspicion + '</span></div>' +
        '<div class="os-stat"><span class="lbl">Time</span><span class="os-timer mono" id="timer-val">' + fmtTime(call.seconds) + '</span></div>' +
      '</div>' +
      '<div class="os-body">' +
        '<div class="os-dock"><div class="dock-title">TOOLS</div>' + dockHtml +

        '</div>' +
        '<div class="os-panel ' + (call.activeTool?"":"collapsed") + '" id="os-panel">' +
          '<div class="panel-head" id="panel-head"></div>' +
          '<div class="panel-body" id="panel-body"></div>' +
        '</div>' +
        '<div class="os-main">' +
          '<div class="msgs" id="msgs"><div class="msg sys">— ' + (call.mode.interaction==="email" ? "inbox empty. Write the first email below." : "call connected") + ' —</div></div>' +
          composerHtml +

  renderTool();

}

function setTool(id){
  call.activeTool = (call.activeTool===id) ? null : id;
  var panel = document.getElementById("os-panel");
  if(panel) panel.classList.toggle("collapsed", !call.activeTool);
  var btns = document.querySelectorAll(".dock-btn");
  for(var i=0;i<btns.length;i++) btns[i].classList.remove("active");
  if(call.activeTool){
    var all = document.querySelectorAll(".dock-btn");
    for(var j=0;j<all.length;j++){
      if(all[j].getAttribute("onclick") === "setTool('"+id+"')") all[j].classList.add("active");
    }
  }
  renderTool();
}

function saveNote(v){ if(call) call.notes = v; }

function renderTool(){
  var head = document.getElementById("panel-head");
  var body = document.getElementById("panel-body");
  if(!head || !body || !call.activeTool) return;
  var t = call.activeTool, c = call.caseObj;

  if(t==="objective"){
    head.textContent = "Mission brief";
    var obj = call.stage==="recon" ? c.recon.objective : c.objective;
    var who = call.stage==="recon" ? (c.recon.label||"Recon contact") : (c.targetName || c.name);
    var desc = call.stage==="recon" ? c.recon.personaDesc : c.persona;
    var tc = TARGET_CARDS[c.id] || {};
    var targetHtml;
    if(call.stage==="recon"){
      targetHtml = '<strong>' + esc(who) + '</strong><span class="vibe">Low-access contact. Chatty, and not guarding anything. Use them to pick up leverage.</span>';
    } else if(c.targetName){
      targetHtml = '<strong>' + esc(c.targetName) + '</strong><span class="role">' + esc(c.targetRole) + ' \u00b7 ' + esc(c.company) + '</span>' + (tc.vibe ? '<span class="vibe">' + esc(tc.vibe) + '</span>' : "");
    } else {
      targetHtml = '<strong>' + esc(tc.who || c.name) + '</strong>' + (tc.vibe ? '<span class="vibe">' + esc(tc.vibe) + '</span>' : "");
    }
    body.innerHTML = '<h5>Objective</h5><div class="p-card">' + esc(obj) + '</div>' +
      '<h5>Target</h5><div class="p-card">' + targetHtml + '</div>' +
      '<h5>Scenario</h5><div class="p-card">' + esc(c.blurb) + '</div>' +
      '<h5>Channel &amp; difficulty</h5><div class="p-card">' + esc(call.mode.name) + ' · <strong>' + esc(call.diff.name) + '</strong><br>' + esc(call.diff.meta.join(" · ")) + '</div>' +
      (call.reconIntel ? '<h5>Leverage acquired</h5><div class="p-card" style="color:var(--amber)">' + esc(call.reconIntel) + '</div>' : "");
  }
  else if(t==="flag"){
    head.textContent = "Submit flag";
    body.innerHTML = flagPanelHtml();
  }
  else if(t==="dossier"){
    head.textContent = "OSINT dossier";
    body.innerHTML = call.dossier ? renderDossierHtml(c, call.dossier) : "<p>No dossier for this mission.</p>";
  }
  else if(t==="log"){
    head.textContent = "Activity log";
    body.innerHTML = '<h5>Suspicion trail</h5><div class="log-list" id="log-list">' +
      (call.log.length ? call.log.map(function(l){ return "<div>" + esc(l) + "</div>"; }).join("") : "<div>—</div>") + '</div>' +
      '<h5>Turns taken</h5><div class="p-card">' + Math.floor(call.history.length/2) + '</div>';
  }
  else if(t==="notes"){
    head.textContent = "Scratchpad";
    body.innerHTML = '<p style="margin-top:0">Your pretext notes. Persists for this mission.</p>' +
      '<textarea class="notes-area" oninput="saveNote(this.value)" placeholder="cover story, names, details you have claimed…">' + esc(call.notes||"") + '</textarea>';
  }
  else if(t==="hints"){
    head.textContent = "Hints";
    body.innerHTML = hintsPanelHtml(call);
  }
}

function flagPanelHtml(){
  var fmt = call.stage==="recon" ? "LEAK{...}" : "FLAG{...}";
  var tried = (call.flagTries||[]).length
    ? '<h5>Attempts</h5>' + call.flagTries.map(function(t){ return '<div class="p-card" style="color:'+(t.ok?"#59C98A":"#F0675C")+'">'+esc(t.val)+' — '+(t.ok?"correct":"no match")+'</div>'; }).join("")
    : "";
  return '<p style="margin-top:0">Once the target reveals the code, capture it here to complete the mission. It looks like <b class="mono">'+fmt+'</b>.</p>'+
    '<input class="notes-area" id="flag-input" style="min-height:auto;font-family:var(--mono)" placeholder="'+fmt+'" onkeydown="if(event.key===\'Enter\'){submitFlag();}">'+
    '<div style="margin-top:10px"><button class="wk-go primary" onclick="submitFlag()">Submit flag</button></div>'+
    '<div id="flag-msg" style="margin-top:10px;font-family:var(--mono);font-size:12px"></div>'+
    tried;
}

function submitFlag(){
  if(!call || call.ended) return;
  var inp=document.getElementById("flag-input");
  var msg=document.getElementById("flag-msg");
  if(!inp) return;
  var val=inp.value.trim();
  if(!val) return;
  call.flagTries = call.flagTries || [];
  var target = call.capturedFlag; // set when NPC leaks it
  var ok = target && val.toLowerCase()===target.toLowerCase();
  call.flagTries.push({val:val, ok:ok});
  if(ok){
    finishCall(true, call.mode.interaction==="email" ? "You captured and submitted the flag." : "You captured and submitted the flag.", target);
  } else {
    if(msg){
      msg.style.color="#F0675C";
      msg.textContent = call.capturedFlag ? "That's not the code the target gave. Check the transcript." : "You haven't been given a code yet — keep working the target.";
    }
    renderTool();
  }
}

function hintsPanelHtml(mission){
  var warn = mission.assisted
    ? '<div class="hint-warn used">Assisted run. This clear will be flagged assisted and won\'t count as a full clear.</div>'
    : '<div class="hint-warn">Using a hint marks this run as assisted. A win still counts toward progress, but is flagged as not fully solo — like disabling achievements. Full clears require zero hints.</div>';
  var list = mission.hints.length
    ? mission.hints.map(function(hn,i){ return '<div class="p-card"><strong>Hint '+(i+1)+'</strong><br>'+esc(hn)+'</div>'; }).join("")
    : '<p>No hints used yet. Try to solve it clean first.</p>';
  var fn = (mission===campaign) ? "requestCampHint" : "requestHint";
  var btn = mission.hintLoading
    ? '<button class="wk-go" disabled>Thinking…</button>'
    : '<button class="wk-go" onclick="'+fn+'()">Reveal hint '+(mission.hints.length+1)+'</button>';
  return warn + '<h5>Revealed</h5>' + list + '<div style="margin-top:12px">' + btn + '</div>';
}

async function requestHint(){
  if(!call || call.ended || call.hintLoading) return;
  call.hintLoading = true;
  renderTool();
  var stageObj = call.stage==="recon" ? call.caseObj.recon : call.caseObj;
  var objective = call.stage==="recon" ? call.caseObj.recon.objective : call.caseObj.objective;
  var transcript = call.history.map(function(m){
    if(m.role==="user") return "CALLER: "+m.content;
    try{ var p=JSON.parse(m.content); return "TARGET: "+(p.reply||""); }catch(e){ return ""; }
  }).filter(Boolean).join("\n");
  var sys = "You are a social-engineering coach for a training game. Give the trainee ONE short, actionable hint (1-2 sentences) to make progress toward their objective, based on the conversation so far. Do NOT reveal the secret flag/code itself. Focus on tradecraft: what lever to try, what's raising suspicion, what to fix. Return ONLY the hint text, no preamble.";
  var user = "OBJECTIVE: "+objective+"\nHINTS ALREADY GIVEN: "+(call.hints.length)+" (make this one different/deeper)\nCURRENT SUSPICION: "+call.suspicion+"/"+call.diff.cap+"\nTRANSCRIPT SO FAR:\n"+(transcript||"(call just started)");
  var hint = await fetchTextFromModel(sys, user);
  if(!call || call.ended) return;
  call.hintLoading = false;
  if(hint){ call.hints.push(hint); call.assisted = true; }
  else { toast("Couldn't get a hint right now. Nothing was counted. Try again."); }
  if(call.activeTool==="hints") renderTool();
  else if(hint) toast("Hint ready in the Hints tab.");
}

}
function focusComposer(){

  else if(els.main){ els.main.focus(); }
}

function addMsg(role, text){
  var msgs = document.getElementById("msgs");
  if(!msgs) return;
  var div = document.createElement("div");
  if(call && call.mode.interaction==="email"){
    var other = call.caseObj.targetName || "Target";
    var subj = call.subjectLine || "";
    var body = text;
    var m = /^Subject:\s*(.*)\n\n([\s\S]*)$/.exec(text);
    if(m){ subj = m[1]; body = m[2]; }
    var re = role==="me" ? (call.history.length>0 && !m ? "Re: " : "") : "Re: ";
    div.className = "mail " + (role==="me" ? "me" : "npc");
    div.innerHTML =
      '<div class="mail-head">' +
        '<div><span class="k">From</span><b>' + esc(role==="me" ? "You" : other) + '</b></div>' +
        '<div><span class="k">To</span>' + esc(role==="me" ? other : "You") + '</div>' +
        '<div><span class="k">Subj</span>' + esc(subj ? (re + subj).replace(/^Re: Re: /,"Re: ") : "(no subject)") + '</div>' +
      '</div><div class="mail-body"></div>';
    div.querySelector(".mail-body").textContent = body;
  } else {
    div.className = "msg " + (role==="me" ? "me" : "npc");
    var tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = role==="me" ? "you" : "target";
    div.appendChild(tag);
    div.appendChild(document.createTextNode(text));
  }
  msgs.appendChild(div);
  msgs.scrollTo({top: msgs.scrollHeight, behavior:"smooth"});
}

function showTyping(){

function setLoading(isLoading){
  if(!call) return;
  call.loading = isLoading;

  } else {

      inputEl.disabled = isLoading;
      inputEl.placeholder = isLoading ? "target is responding…" : "say something…";

  }

function updateTimerUI(){
  var el = document.getElementById("timer-val");
  if(!el || !call) return;
  el.textContent = fmtTime(call.seconds);
  el.classList.toggle("warn", call.seconds < 30);
}
function updateSuspicionUI(){
  if(!call) return;
  var pct = call.suspicion;
  var color = pct<40 ? "var(--green)" : pct<75 ? "var(--amber)" : "var(--red)";
  var fill = document.getElementById("gauge-fill");
  var num = document.getElementById("gauge-num");
  if(fill){ fill.style.width = pct + "%"; fill.style.background = color; }
  if(num) num.textContent = pct;
}
function updateLogUI(){
  if(call && call.activeTool==="log"){ renderTool(); return; }
  var list = document.getElementById("log-list");
  if(!list || !call) return;
  if(call.log.length===0){ list.innerHTML = "<div>—</div>"; return; }
  list.innerHTML = call.log.map(function(l){ return "<div>" + esc(l) + "</div>"; }).join("");
}

function tick(){
  if(!call || call.ended || call.timerPaused || call.loading) return;
  if(call.timerId !== activeTimerId) return;
  call.seconds -= 1;
  if(call.seconds <= 0){
    call.seconds = 0;
    updateTimerUI();
    if(call.stage==="recon"){
      finishCall(false, "Recon window closed before you got usable leverage.");
    } else {
      finishCall(false, call.mode.interaction==="email" ? "Time expired. The thread went cold." : "Time expired. The line went cold before you got the flag.");
    }
    return;
  }
  updateTimerUI();
}

async function openingLine(){
  showTyping();
  var r = await callModel(call.systemPrompt, []);
  hideTyping();
  if(!call || call.ended) return;
  if(r.__error){ showCallError(r.__error, "retryOpening"); return; }
  r = normReply(r);
  addMsg("npc", r.reply || "...");
  call.history.push({role:"assistant", content: JSON.stringify(r)});
  setLoading(false);
  focusComposer();
}

async function sendMsg(){
  if(!call || call.loading || call.ended) return;
  var els = composerEls();
  if(!els.main) return;
  var bodyText = els.main.value.trim();
  if(!bodyText) return;
  var isFirst = call.history.length===0;
  var outgoing = bodyText;
  var displayText = bodyText;

  if(call.mode.interaction==="email" && isFirst){
    var subj = els.subject ? els.subject.value.trim() : "";
    if(!subj){ if(els.subject) els.subject.focus(); return; }
    call.subjectLine = subj;
    outgoing = "Subject: " + subj + "\n\n" + bodyText;
    displayText = outgoing;
    if(els.subject){ els.subject.value = "Re: " + subj; els.subject.disabled = true; }
  }

  els.main.value = "";
  addMsg("me", displayText);
  call.history.push({role:"user", content: outgoing});
  setLoading(true);
  showTyping();

  var r = await callModel(call.systemPrompt, call.history);
  hideTyping();
  if(!call || call.ended) return;
  if(r.__error){
    call.history.pop();
    call.pendingRetry = outgoing;
    showCallError(r.__error, "retrySend");
    return;
  }
  handleReply(r);
}

function advanceStage(){
  if(call.timerId) clearInterval(call.timerId);
  call.stage = "main";
  call.systemPrompt = computeStagePrompt();
  call.seconds = call.diff.seconds;
  call.suspicion = 20;
  call.history = [];
  call.subjectLine = null;
  call.log = [];
  renderCallShell();
  appendSystemNote('Leverage acquired: "' + call.reconIntel + '" — now reaching the primary target.');
  beginStage();
  call.timerId = setInterval(tick, 1000); activeTimerId = call.timerId;
}

function normReply(r){
  if(!r || typeof r!=="object") r={};
  if(typeof r.reply!=="string") r.reply = (r.reply==null? "..." : String(r.reply));
  var d = Number(r.suspicion_delta);
  r.suspicion_delta = isFinite(d) ? Math.max(-15, Math.min(30, Math.round(d))) : 0;
  r.hangup = (r.hangup===true || r.hangup==="true");
  r.flag_leaked = (r.flag_leaked===true || r.flag_leaked==="true");
  return r;
}
function handleReply(r){
  r = normReply(r);
  addMsg("npc", r.reply || "...");
  call.history.push({role:"assistant", content: JSON.stringify(r)});

  var delta = Math.round((r.suspicion_delta||0) * call.diff.sensitivity);
  call.suspicion = Math.max(0, Math.min(call.diff.cap, call.suspicion + delta));
  call.log.push((delta>=0?"+":"") + delta + " suspicion");
  call.trail.push({delta:delta, susp:call.suspicion});
  if(call.log.length>6) call.log = call.log.slice(-6);
  updateSuspicionUI();
  updateLogUI();

  var secretMatch = (r.reply||"").match(secretRegexFor(call.stage));
  if(r.flag_leaked && secretMatch){
    if(call.stage === "recon"){
      call.reconIntel = secretMatch[1] ? secretMatch[1].trim() : secretMatch[0];
      advanceStage();
      return;
    }
    if(call.diff.forgiving){
      // beginner: auto-capture, no manual flag submission
      finishCall(true, "The target read out the flag.", secretMatch[0]);
      return;
    }
    // non-beginner: capture it, player must recognize + submit via Flag tab
    call.capturedFlag = secretMatch[0];
    appendSystemNote("A code was just spoken. If that's what you need, capture it in the Flag tab.");
    setLoading(false);
    focusComposer();
    return;
  }
  if(r.hangup || call.suspicion >= call.diff.cap){
    if(call.stage === "recon"){
      finishCall(false, "The recon contact clammed up. Without leverage, the primary target was never going to fold.");
    } else {
      finishCall(false, call.mode.interaction==="email" ? "They stopped replying. This thread is dead." : "The target hung up — suspicion peaked.");
    }
    return;
  }
  setLoading(false);
  focusComposer();
}

function showCallError(msg, retryFn){
  if(call) call.timerPaused = true;
  var msgs = document.getElementById("msgs");
  if(msgs){
    var d = document.createElement("div");
    d.className = "msg sys";
    d.innerHTML = '<div class="gate-err" style="margin-bottom:8px;">' + esc(msg) + '</div>' +
      '<button class="cb-change" onclick="' + retryFn + '()">Retry</button>';
    msgs.appendChild(d);
    msgs.scrollTo({top:msgs.scrollHeight, behavior:"smooth"});
  }
  setLoading(false);
}
function retryOpening(){
  if(!call) return;
  call.timerPaused = false;
  setLoading(true);
  openingLine();
}
function retrySend(){
  if(!call || !call.pendingRetry) return;
  call.timerPaused = false;
  var text = call.pendingRetry;
  call.pendingRetry = null;
  call.history.push({role:"user", content:text});
  setLoading(true);
  showTyping();
  callModel(call.systemPrompt, call.history).then(function(r){
    hideTyping();
    if(!call || call.ended) return;
    if(r.__error){ call.history.pop(); call.pendingRetry = text; showCallError(r.__error,"retrySend"); return; }
    handleReply(r);
  });
}
function hangupCall(){
  finishCall(false, call.mode.interaction==="email" ? "Thread abandoned." : "Call abandoned.");
}

function finishCall(won, reason, flag){
  if(!call || call.ended) return;
  call.ended = true;
  if(call.timerId) clearInterval(call.timerId);
  lastResult = {won:won, reason:reason, flag:flag, suspicion:call.suspicion, timeLeft:call.seconds, diff:call.diff, caseObj:call.caseObj, mode:call.mode, assisted:call.assisted, hintsUsed:call.hints.length,
    trail:(call.trail||[]).slice(), transcript:call.history.map(function(m){
      if(m.role==="assistant"){ try{ return {role:"npc", text:JSON.parse(m.content).reply}; }catch(e){ return {role:"npc", text:m.content}; } }
      return {role:"me", text:m.content};
    }), debrief:null};
  if(won){ markComplete(call.mode.id, call.caseObj.id, call.diff.id, call.assisted); }
  ui.screen = "end";
  renderEnd();
}
